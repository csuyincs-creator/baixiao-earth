<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星空地球 · 6 状态横版同屏</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05080f; color:#cfe3ff;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; overflow:hidden; }
  header { position:fixed; top:0; left:0; right:0; height:46px; z-index:50;
    display:flex; align-items:center; gap:14px; padding:0 16px;
    background:rgba(8,14,26,.82); border-bottom:1px solid rgba(120,170,255,.15);
    backdrop-filter:blur(8px); }
  header h1 { font-size:15px; font-weight:600; letter-spacing:.04em; white-space:nowrap; }
  header .hint { font-size:12px; color:#8fa6cc; }
  header .hint b { color:#bcd4ff; font-weight:600; }
  #grid { position:fixed; top:46px; left:0; right:0; bottom:0;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);
    gap:4px; padding:4px; background:#05080f; }
  @media (max-width:1000px){ #grid{ grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr);} }
  @media (max-width:620px){ #grid{ grid-template-columns:1fr; grid-template-rows:repeat(6,1fr);} }
  .frame { position:relative; overflow:hidden; border:1px solid rgba(120,170,255,.14);
    background:#04060d; cursor:default; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#04060d;
    pointer-events:auto; }
  .frame .tag { position:absolute; left:10px; top:8px; z-index:5; font-size:12px; color:#bcd4ff;
    text-shadow:0 1px 4px #000; pointer-events:none; }
  .frame .zoom-btn { position:absolute; right:8px; top:8px; z-index:7; width:28px; height:28px;
    border-radius:6px; border:1px solid rgba(120,170,255,.35); background:rgba(8,14,26,.72);
    color:#cfe3ff; font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .frame .zoom-btn:hover { background:rgba(20,34,58,.9); }
  .frame.zoomed { position:fixed; inset:46px 0 0 0; z-index:100; border:0; }
  .frame.zoomed .tag { font-size:14px; }
  .frame.zoomed .zoom-btn { width:32px; height:32px; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>星空地球 · 6 状态横版同屏</h1>
  <span class="hint">复用源码 <b>index.html / appv2.js</b>(零改动) · 点 <b>⛶</b> 放大 · 框内可用原设置面板调大小/亮度/光点/轨道/配色</span>
</header>
<div id="grid"></div>
<script>
const STATE_NAMES = [
  "① 初始 · 裸地球",
  "② 保护 · 云层",
  "③ 物体 · 城市光点",
  "④ 卫星 · 轨道环绕",
  "⑤ 领航 · 大气辉光",
  "⑥ 领航 · 全景"
];
const grid = document.getElementById('grid');

for (let i = 0; i < 6; i++) {
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.dataset.i = i;

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = STATE_NAMES[i];

  const btn = document.createElement('button');
  btn.className = 'zoom-btn';
  btn.textContent = '⛶';
  btn.title = '放大 / 还原';

  const iframe = document.createElement('iframe');
  iframe.src = 'demo.html';
  iframe.setAttribute('scrolling', 'no');
  iframe.setAttribute('title', STATE_NAMES[i]);

  frame.appendChild(iframe);
  frame.appendChild(tag);
  frame.appendChild(btn);
  grid.appendChild(frame);

  // 加载完成后自动滚动到对应状态段（同源可访问 contentDocument）
  iframe.addEventListener('load', () => {
    let tries = 0;
    const place = () => {
      tries++;
      try {
        const doc = iframe.contentDocument;
        if (!doc) return;
        const anchors = doc.querySelectorAll('[data-earth-state-anchor]');
        if (anchors.length >= 6) {
          const a = anchors[i];
          const top = a.getBoundingClientRect().top + iframe.contentWindow.scrollY;
          iframe.contentWindow.scrollTo(0, Math.max(0, top));
        } else if (tries < 60) {
          setTimeout(place, 150);
        }
      } catch (e) { /* 同源不会出现跨域错误 */ }
    };
    setTimeout(place, 700);
  });

  const toggle = () => frame.classList.toggle('zoomed');
  btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
}

// Esc 还原所有放大窗口
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.frame.zoomed').forEach(f => f.classList.remove('zoomed'));
  }
});
</script>
</body>
</html>
