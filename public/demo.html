<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth states</title>
  <link rel="stylesheet" href="appv2.css?v=earth-states-1">
  <style>
    :root { --earth-control: rgba(255, 255, 255, .9); }
    html, body { margin: 0; min-height: 100%; background: #070b14; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    body { overflow-x: hidden; }
    .earth-state-shell { position: relative; min-height: 600vh; }
    #canvas-wrapper { position: fixed !important; inset: 0; z-index: 0; pointer-events: none; }
    #canvas-wrapper canvas { position: fixed !important; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    [data-webgl="GlobeIntro"] { position: relative; z-index: 1; }
    [data-webgl="GlobeIntro"] > section,
    [data-webgl="Wayfinder"] > section { min-height: 100vh; height: 100vh; pointer-events: none; }
    [data-webgl="GlobeIntro"] > section > *,
    [data-webgl="Wayfinder"] > section > * { visibility: hidden !important; opacity: 0 !important; }
    /* The source page uses this rectangular MP4 as editorial copy for the objects state.
       The clean earth view keeps the timeline anchor but removes that visual layer. */
    [data-webgl="GlobeIntro"] .objects-section .video-w,
    [data-webgl="GlobeIntro"] .objects-section .objects-video { display: none !important; }
    .earth-state-controls {
      align-items: center;
      background: rgba(5, 10, 20, .55);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      bottom: 28px;
      display: flex;
      gap: 12px;
      left: 50%;
      padding: 9px 12px;
      position: fixed;
      transform: translateX(-50%);
      z-index: 20;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .earth-state-controls button {
      align-items: center;
      background: transparent;
      border: 0;
      color: var(--earth-control);
      cursor: pointer;
      display: inline-flex;
      height: 30px;
      justify-content: center;
      padding: 0;
      width: 30px;
    }
    .earth-state-controls button:hover { color: #fff; transform: scale(1.08); }
    .earth-state-controls svg { fill: currentColor; height: 18px; width: 18px; }
    .earth-state-dots { align-items: center; display: flex; gap: 7px; padding: 0 3px; }
    .earth-state-dots button { height: 8px; width: 8px; }
    .earth-state-dots button::before {
      background: rgba(255, 255, 255, .42);
      border-radius: 999px;
      content: "";
      display: block;
      height: 6px;
      transition: background .25s ease, transform .25s ease;
      width: 6px;
    }
    .earth-state-dots button.is-active::before { background: #fff; transform: scale(1.45); }
    .earth-drag-layer {
      cursor: grab;
      inset: 0;
      position: fixed;
      touch-action: none;
      z-index: 4;
    }
    .earth-drag-layer.is-dragging { cursor: grabbing; }
    .earth-settings-toggle {
      align-items: center;
      background: rgba(5, 10, 20, .66);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 50%;
      color: rgba(255, 255, 255, .92);
      cursor: pointer;
      display: flex;
      height: 42px;
      justify-content: center;
      position: fixed;
      right: 24px;
      top: 24px;
      transition: background .2s ease, transform .2s ease;
      width: 42px;
      z-index: 30;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .earth-settings-toggle:hover { background: rgba(25, 38, 60, .88); transform: rotate(24deg); }
    .earth-settings-toggle svg { fill: none; height: 20px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; width: 20px; }
    .earth-settings-panel {
      background: rgba(7, 13, 26, .9);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 16px;
      color: rgba(255, 255, 255, .9);
      display: none;
      max-height: calc(100vh - 84px);
      overflow: auto;
      padding: 18px 18px 16px;
      position: fixed;
      right: 24px;
      top: 76px;
      width: min(340px, calc(100vw - 48px));
      z-index: 29;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .42);
    }
    .earth-settings-panel.is-open { display: block; }
    .earth-settings-panel h2 { font-size: 14px; letter-spacing: .12em; margin: 0 0 4px; text-transform: uppercase; }
    .earth-settings-panel .settings-note { color: rgba(220, 230, 245, .62); font-size: 11px; line-height: 1.45; margin: 0 0 16px; }
    .settings-group { border-top: 1px solid rgba(255, 255, 255, .1); margin-top: 14px; padding-top: 14px; }
    .settings-group h3 { color: rgba(220, 230, 245, .72); font-size: 11px; letter-spacing: .12em; margin: 0 0 10px; text-transform: uppercase; }
    .settings-row { align-items: center; display: grid; gap: 10px; grid-template-columns: 1fr 112px 42px; margin: 9px 0; }
    .settings-row label { font-size: 12px; }
    .settings-row output { color: #8feee9; font-variant-numeric: tabular-nums; text-align: right; }
    .settings-row input[type="range"] { accent-color: #6be4e6; min-width: 0; width: 100%; }
    .settings-colors { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
    .settings-color { align-items: center; color: rgba(220, 230, 245, .72); display: flex; flex-direction: column; font-size: 10px; gap: 5px; }
    .settings-color input { background: transparent; border: 0; cursor: pointer; height: 28px; padding: 0; width: 54px; }
    .settings-presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .settings-presets button, .settings-reset {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      color: rgba(255, 255, 255, .86);
      cursor: pointer;
      font-size: 11px;
      padding: 6px 10px;
    }
    .settings-presets button:hover, .settings-reset:hover { background: rgba(255, 255, 255, .16); }
    .settings-checks { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .settings-checks label { align-items: center; color: rgba(220, 230, 245, .8); display: flex; font-size: 12px; gap: 7px; }
    .settings-checks input { accent-color: #6be4e6; }
    .settings-footer { display: flex; justify-content: flex-end; margin-top: 14px; }
    @media (max-width: 600px) {
      .earth-state-controls { bottom: 18px; }
      .earth-settings-toggle { right: 14px; top: 14px; }
      .earth-settings-panel { right: 14px; top: 66px; width: min(340px, calc(100vw - 28px)); }
    }
  </style>
</head>
<body>

        <label class="settings-color">B<input type="color" data-color="orbitB" value="#ff23c8"></label>
        <label class="settings-color">C<input type="color" data-color="orbitC" value="#9a6cff"></label>
      </div>
      <div class="settings-presets" data-preset-group="orbits">

    <div class="settings-footer"><button class="settings-reset" type="button" data-setting-action="reset">恢复默认</button></div>

  <nav class="earth-state-controls" aria-label="Earth states controls">
    <button type="button" data-earth-action="previous" aria-label="Previous state">
      <svg viewBox="0 0 24 24"><path d="m14.7 5.3-1.4-1.4L6.2 11l7.1 7.1 1.4-1.4L9 11z"></path></svg>
    </button>
    <button type="button" data-earth-action="play" aria-label="Play states">
      <svg data-icon="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
      <svg data-icon="pause" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zm6 0h4v14h-4z"></path></svg>
    </button>
    <button type="button" data-earth-action="next" aria-label="Next state">
      <svg viewBox="0 0 24 24"><path d="m9.3 5.3 1.4-1.4 7.1 7.1-7.1 7.1-1.4-1.4L15 11z"></path></svg>
    </button>
    <div class="earth-state-dots" role="tablist" aria-label="Earth states">
      <button type="button" data-earth-state="0" role="tab" aria-label="State 1"></button>
      <button type="button" data-earth-state="1" role="tab" aria-label="State 2"></button>
      <button type="button" data-earth-state="2" role="tab" aria-label="State 3"></button>
      <button type="button" data-earth-state="3" role="tab" aria-label="State 4"></button>
      <button type="button" data-earth-state="4" role="tab" aria-label="State 5"></button>
      <button type="button" data-earth-state="5" role="tab" aria-label="State 6"></button>
    </div>
  </nav>

  <script>
    // The source scene pauses its tracking video while a smooth state change is in flight.
    // Chromium reports that expected pause/play race as an unhandled rejected promise.
    window.addEventListener('unhandledrejection', (event) => {
      const message = event.reason && event.reason.message;
      if (message && message.includes('play() request was interrupted')) event.preventDefault();
    });
  </script>
  <script>
    window.__EARTH_STATES_HIDE_OBJECT_VIDEO__ = true;
    // These values are consumed by the original GlobeIntro/Wayfinder onTick methods.
    // Keeping them global lets the settings panel tune the source runtime without cloning it.
    window.__BAIXIAO_EARTH_SETTINGS__ = {
      autoRotateMultiplier: 2.6,
      scale: 1,
      brightness: 1,
      dragSensitivity: 1.2,
      pointScale: 1,
      orbitIntensity: 1,
      showPoints: true,
      showOrbits: true,
      showAtmosphere: true,
      showClouds: true,
      pointA: '#19e9df', pointB: '#ff35d1', pointC: '#ffffff',
      orbitA: '#14efe0', orbitB: '#ff23c8', orbitC: '#9a6cff'
    };
    window.__BAIXIAO_EARTH_DRAG_ROTATION__ = { x: 0, y: 0 };
  </script>
  <script src="appv2.js?v=object-video-source-hidden-drag-settings"></script>
  <script>
    (() => {
      const states = [...document.querySelectorAll('[data-earth-state-anchor]')];
      const controls = document.querySelector('.earth-state-controls');
      const playButton = controls.querySelector('[data-earth-action="play"]');
      const playIcon = playButton.querySelector('[data-icon="play"]');
      const pauseIcon = playButton.querySelector('[data-icon="pause"]');
      const dots = [...controls.querySelectorAll('[data-earth-state]')];
      let active = 0;
      let playing = false;
      let timer = 0;

      const setActive = (index) => {
        active = (index + states.length) % states.length;
        dots.forEach((dot, dotIndex) => {
          const selected = dotIndex === active;
          dot.classList.toggle('is-active', selected);
          dot.setAttribute('aria-selected', String(selected));
        });
      };

      const goTo = (index, smooth = true) => {
        setActive(index);
        states[active].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
      };

      const stop = () => {
        playing = false;
        window.clearTimeout(timer);
        playIcon.hidden = false;
        pauseIcon.hidden = true;
        playButton.setAttribute('aria-label', 'Play states');
      };

      const schedule = () => {
        window.clearTimeout(timer);
        if (!playing) return;
        timer = window.setTimeout(() => {
          goTo(active + 1);
          schedule();
        }, 3600);
      };

      const start = () => {
        playing = true;
        playIcon.hidden = true;
        pauseIcon.hidden = false;
        playButton.setAttribute('aria-label', 'Pause states');
        schedule();
      };

      controls.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const action = button.dataset.earthAction;
        if (action === 'play') return playing ? stop() : start();
        stop();
        if (action === 'previous') goTo(active - 1);
        if (action === 'next') goTo(active + 1);
        if (button.dataset.earthState !== undefined) goTo(Number(button.dataset.earthState));
      });

      window.addEventListener('scroll', () => {
        const next = Math.round(window.scrollY / Math.max(1, window.innerHeight));
        if (next !== active && next >= 0 && next < states.length) setActive(next);
      }, { passive: true });
      window.addEventListener('wheel', stop, { passive: true });
      window.addEventListener('pointerdown', (event) => {
        if (!controls.contains(event.target)) stop();
      }, { passive: true });
      window.addEventListener('resize', () => goTo(active, false));
      window.history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
      setActive(0);
    })();
  </script>

  <script>
    (() => {
      const settings = window.__BAIXIAO_EARTH_SETTINGS__;
      const dragRotation = window.__BAIXIAO_EARTH_DRAG_ROTATION__;
      const panel = document.querySelector('.earth-settings-panel');
      const toggle = document.querySelector('.earth-settings-toggle');
      const dragLayer = document.querySelector('.earth-drag-layer');
      const defaults = JSON.parse(JSON.stringify(settings));
      const presetSets = {
        points: {
          neon: ['#19e9df', '#ff35d1', '#ffffff'],
          ice: ['#7ee7ff', '#4c8dff', '#e7fbff'],
          sunset: ['#ffb347', '#ff4f81', '#ffe4b5'],
          aurora: ['#62ffd1', '#8c7bff', '#e9ff8f']
        },
        orbits: {
          neon: ['#14efe0', '#ff23c8', '#9a6cff'],
          ice: ['#b5f7ff', '#4e9dff', '#a5c8ff'],
          sunset: ['#ffca70', '#ff477e', '#ff7e42'],
          aurora: ['#4fffd1', '#69a7ff', '#d073ff']
        }
      };

      const getSections = () => window.__BAIXIAO_WEBGL_SECTIONS__ || [];
      const getColorCtor = () => {
        for (const section of getSections()) {
          const value = section.earth?.material?.uniforms?.uSunColor?.value;
          if (value?.constructor) return value.constructor;
        }
        return null;
      };
      const makeColor = (hex) => {
        const ColorCtor = getColorCtor();
        if (ColorCtor) return new ColorCtor(hex);
        const n = Number.parseInt(hex.slice(1), 16);
        return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255 };
      };
      const setColor = (material, uniformName, hex) => {
        const uniform = material?.uniforms?.[uniformName];
        if (!uniform) return;
        if (uniform.value?.set) uniform.value.set(hex);
        else uniform.value = makeColor(hex);
      };
      const setNumber = (material, uniformName, multiplier) => {
        const uniform = material?.uniforms?.[uniformName];
        if (!uniform || typeof uniform.value !== 'number') return;
        material.userData.__baixiaoBase ??= {};
        material.userData.__baixiaoBase[uniformName] ??= uniform.value;
        uniform.value = material.userData.__baixiaoBase[uniformName] * multiplier;
      };
      const materialsIn = (object) => {
        const found = [];
        object?.traverse?.((node) => { if (node.material) found.push(node.material); });
        if (object?.material && !found.includes(object.material)) found.push(object.material);
        return found;
      };
      const decorateParticle = (material) => {
        if (!material || material.userData.__baixiaoParticleDecorated) return;
        material.vertexShader = material.vertexShader
          .replace('#define BLUE vec3(.1, .9, .8)', 'uniform vec3 uPointColorA;')
          .replace('#define PINK vec3(.8, .1, .6)', 'uniform vec3 uPointColorB;')
          .replace('vColor = mix(BLUE, PINK, step(.6, aColor) * step(aColor, .95));', 'vColor = mix(uPointColorA, uPointColorB, step(.5, aColor)); vColor = mix(vColor, uPointColorC, step(.85, aColor));')
          .replace('uniform float uProgress;\n', 'uniform float uProgress;\nuniform float uPointScale;\nuniform vec3 uPointColorC;\n');
        material.vertexShader = material.vertexShader.replace('gl_PointSize = (300.0 / length(mvPosition));', 'gl_PointSize = (300.0 * uPointScale / length(mvPosition));');
        material.fragmentShader = material.fragmentShader.replace('varying float vProgress;\n', 'varying float vProgress;\nuniform float uPointIntensity;\n').replace('vec3 color = vColor + smoothstep(.6, .0, length(gl_PointCoord.xy - .2)) * .5;', 'vec3 color = (vColor + smoothstep(.6, .0, length(gl_PointCoord.xy - .2)) * .5) * uPointIntensity;');
        material.uniforms.uPointScale = { value: 1 };
        material.uniforms.uPointIntensity = { value: 1 };
        material.uniforms.uPointColorA = { value: makeColor(settings.pointA) };
        material.uniforms.uPointColorB = { value: makeColor(settings.pointB) };
        material.uniforms.uPointColorC = { value: makeColor(settings.pointC) };
        material.userData.__baixiaoParticleDecorated = true;
        material.needsUpdate = true;
      };
      const decorateOrbit = (material) => {
        if (!material || material.userData.__baixiaoOrbitDecorated) return;
        material.fragmentShader = material.fragmentShader
          .replace('#define BLUE vec3(.1, .9, .8)', 'uniform vec3 uOrbitColorA;')
          .replace('#define PINK vec3(.8, .1, .6)', 'uniform vec3 uOrbitColorB;')
          .replace('vec3 color = mix(BLUE, PINK, step(.5, vSeed));', 'vec3 color = mix(uOrbitColorA, uOrbitColorB, step(.5, vSeed)); color = mix(color, uOrbitColorC, step(.85, vSeed));')
          .replace('uniform vec3 uOrbitColorB;\n', 'uniform vec3 uOrbitColorB;\nuniform vec3 uOrbitColorC;\n');
        material.uniforms.uOrbitColorA = { value: makeColor(settings.orbitA) };
        material.uniforms.uOrbitColorB = { value: makeColor(settings.orbitB) };
        material.uniforms.uOrbitColorC = { value: makeColor(settings.orbitC) };
        material.userData.__baixiaoOrbitDecorated = true;
        material.needsUpdate = true;
      };
      const setDecoratedColors = (material, prefix, names) => {
        if (!material?.uniforms) return;
        names.forEach((name) => setColor(material, name, settings[`${prefix}${name.slice(-1)}`]));
      };
      const syncInputs = () => {
        document.querySelectorAll('[data-setting]').forEach((input) => {
          const key = input.dataset.setting;
          input.type === 'checkbox' ? input.checked = Boolean(settings[key]) : input.value = settings[key];
        });
        document.querySelectorAll('[data-color]').forEach((input) => { input.value = settings[input.dataset.color]; });
        document.querySelectorAll('[data-output]').forEach((output) => {
          const value = Number(settings[output.dataset.output]);
          output.textContent = `${value.toFixed(output.dataset.output === 'autoRotateMultiplier' ? 1 : 2)}×`;
        });
      };
      const apply = () => {
        getSections().forEach((section) => {
          section.wrapper?.scale?.setScalar(settings.scale);
          const earthMaterials = materialsIn(section.earth);
          earthMaterials.forEach((material) => {
            setNumber(material, 'uLightIntensity', settings.brightness);
            setNumber(material, 'uSunIntensity', settings.brightness);
          });
          materialsIn(section.atmosphere).forEach((material) => setNumber(material, 'uIntensity', settings.brightness));
          section.atmosphere && (section.atmosphere.visible = settings.showAtmosphere);
          section.clouds && (section.clouds.visible = settings.showClouds);

          const pointMaterial = section.privateerSatellites?.material;
          if (pointMaterial) {
            decorateParticle(pointMaterial);
            pointMaterial.visible = settings.showPoints;
            pointMaterial.uniforms.uPointScale.value = settings.pointScale;
            pointMaterial.uniforms.uPointIntensity.value = settings.brightness;
            setColor(pointMaterial, 'uPointColorA', settings.pointA);
            setColor(pointMaterial, 'uPointColorB', settings.pointB);
            setColor(pointMaterial, 'uPointColorC', settings.pointC);
          }
          const orbitMaterials = materialsIn(section.privateerTrajectories);
          orbitMaterials.forEach((material) => {
            decorateOrbit(material);
            material.visible = settings.showOrbits;
            setNumber(material, 'uIntensity', settings.orbitIntensity);
            setColor(material, 'uOrbitColorA', settings.orbitA);
            setColor(material, 'uOrbitColorB', settings.orbitB);
            setColor(material, 'uOrbitColorC', settings.orbitC);
          });
          if (section.privateerTrajectories) section.privateerTrajectories.visible = settings.showOrbits;
          if (section.privateerSatellites) section.privateerSatellites.visible = settings.showPoints;
        });
        syncInputs();
        try { localStorage.setItem('baixiao-earth-settings', JSON.stringify(settings)); } catch (_) { /* private browsing */ }
      };
      const restore = () => { Object.assign(settings, JSON.parse(JSON.stringify(defaults))); dragRotation.x = 0; dragRotation.y = 0; apply(); };

      try { Object.assign(settings, JSON.parse(localStorage.getItem('baixiao-earth-settings') || '{}')); } catch (_) { /* private browsing */ }
      toggle.addEventListener('click', () => {
        const open = !panel.classList.contains('is-open');
        panel.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', String(open));
      });
      panel.addEventListener('input', (event) => {
        const input = event.target;
        if (input.matches('[data-setting]')) settings[input.dataset.setting] = input.type === 'checkbox' ? input.checked : Number(input.value);
        if (input.matches('[data-color]')) settings[input.dataset.color] = input.value;
        apply();
      });
      panel.addEventListener('click', (event) => {
        const presetButton = event.target.closest('[data-preset]');
        if (presetButton) {
          const group = presetButton.closest('[data-preset-group]')?.dataset.presetGroup;
          const values = presetSets[group]?.[presetButton.dataset.preset];
          if (values) ['A', 'B', 'C'].forEach((letter, index) => { settings[`${group === 'points' ? 'point' : 'orbit'}${letter}`] = values[index]; });
          apply();
        }
        if (event.target.closest('[data-setting-action="reset"]')) restore();
      });
      let drag = null;
      dragLayer.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
        dragLayer.setPointerCapture?.(event.pointerId);
        dragLayer.classList.add('is-dragging');
      });
      dragLayer.addEventListener('pointermove', (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        drag.x = event.clientX; drag.y = event.clientY;
        dragRotation.x += dx * .008 * settings.dragSensitivity;
        dragRotation.y = Math.max(-1.45, Math.min(1.45, dragRotation.y + dy * .008 * settings.dragSensitivity));
      });
      const endDrag = (event) => { if (drag?.id === event.pointerId) { drag = null; dragLayer.classList.remove('is-dragging'); } };
      dragLayer.addEventListener('pointerup', endDrag);
      dragLayer.addEventListener('pointercancel', endDrag);
      const waitForScenes = (attempt = 0) => {
        if (getSections().some((section) => section.earth?.material)) apply();
        else if (attempt < 180) window.setTimeout(() => waitForScenes(attempt + 1), 100);
      };
      waitForScenes();
      syncInputs();
    })();
  </script>
</body>
</html>
